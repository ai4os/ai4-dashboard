<div class="content">
    <app-ui-banner variant="primary" decoration="deployments">
        <h1>
            {{ 'DEPLOYMENTS.HEADER' | translate }}
        </h1>
    </app-ui-banner>

    <div class="tables-container">
        <!-- Modules -->
        <app-deployments-table
            [cardName]="'DEPLOYMENTS.MODULES' | translate"
            [isLoading]="isModulesTableLoading"
            [dataset]="modulesDataset"
            [datacentersNotifications]="displayedNotifications"
            [detailRouteBase]="detailRouteBase"
            (deleteElement)="removeModule($event)"
        ></app-deployments-table>

        <!-- Tools -->
        <app-deployments-table
            [cardName]="'DEPLOYMENTS.TOOLS' | translate"
            [showCardActions]="true"
            [isLoading]="isToolsTableLoading"
            deploymentType="tool"
            [dataset]="toolsDataset"
            [datacentersNotifications]="displayedNotifications"
            [detailRouteBase]="detailRouteBase"
            (deleteElement)="removeTool($event)"
        ></app-deployments-table>

        <!-- Snapshots -->
        <app-deployments-table
            [cardName]="'DEPLOYMENTS.SNAPSHOTS' | translate"
            [isLoading]="isSnapshotsTableLoading"
            deploymentType="snapshot"
            [dataset]="snapshotsDataset"
            [columns]="snapshotColumns"
            [detailRouteBase]="snapshotDetailRouteBase"
            (deleteElement)="removeSnapshot($event)"
        ></app-deployments-table>
    </div>
</div>
