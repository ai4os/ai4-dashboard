<div class="deployment-secrets">
    <form
        [formGroup]="secretFormGroup"
        class="new-secret"
        (ngSubmit)="addSecret()"
    >
        <app-ui-text-field
            class="new-secret__field"
            formControlName="secret"
            label="DEPLOYMENTS.SECRETS.NEW-SECRET-NAME"
            [errorMessages]="secretNameErrorMessages"
        ></app-ui-text-field>
        <app-ui-button
            icon="add"
            text="GENERAL.CREATE"
            variant="accent-solid"
            matTooltipClass="ui-tooltip"
            matTooltip="{{ 'DEPLOYMENTS.SECRETS.CREATE-TOOLTIP' | translate }}"
            [matTooltipDisabled]="secretFormGroup.valid && !isLoading"
            [disabled]="secretFormGroup.invalid || isLoading"
            (buttonClick)="addSecret()"
        >
        </app-ui-button>
    </form>

    <mat-divider></mat-divider>

    <div class="secrets-list">
        @for (secret of paginatedSecrets; track secret.name) {
            <div class="secret-item">
                <span class="secret-item__name">{{ secret.name }}</span>
                <div class="secret-item__row">
                    <app-ui-credential-row
                        class="secret-item__value"
                        [value]="secret.value"
                        [maskable]="true"
                    ></app-ui-credential-row>
                    <app-ui-button
                        variant="danger-solid"
                        icon="delete"
                        matTooltipClass="ui-tooltip"
                        matTooltip="{{ 'GENERAL.REVOKE' | translate }}"
                        (buttonClick)="deleteSecret(secret.name)"
                    ></app-ui-button>
                </div>
            </div>
        }

        @if (secrets.length === 0 && !isLoading) {
            <p class="empty-list">
                {{ 'DEPLOYMENTS.SECRETS.EMPTY-LIST' | translate }}
            </p>
        }
    </div>

    @if (secrets.length > pageSize) {
        <mat-paginator
            class="secrets-paginator"
            (page)="handlePageEvent($event)"
            [length]="secrets.length"
            [pageSize]="pageSize"
            [pageIndex]="pageIndex"
            [showFirstLastButtons]="true"
            aria-label="Select page"
        ></mat-paginator>
    }

    @if (isLoading) {
        <div class="deployment-secrets__loading">
            <app-ui-loader></app-ui-loader>
        </div>
    }
</div>
