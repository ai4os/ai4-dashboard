<mat-toolbar>
  <span class="title">
    {{ 'DASHBOARD.GPU-PER-MODEL' | translate }}

    <mat-icon>developer_board</mat-icon></span
    >
  </mat-toolbar>

  <mat-card>

    <mat-card-content
        [ngClass]="{
            'card-content-mobile': mobileQuery.matches,
        }"
      >
      @if (!isLoading) {
        <div id="canvas" echarts [options]="chartOptionsCommon"></div>
      } @else {
        <div class="spinner">
          <mat-progress-spinner color="primary" mode="indeterminate">
          </mat-progress-spinner>
        </div>
      }
    </mat-card-content>
    <mat-card-actions align="end">
      <button
        id="ok-button"
        mat-raised-button
        mat-dialog-close
        color="accent"
        >
        Ok
      </button>
    </mat-card-actions>
  </mat-card>
