<div class="section-header">
    <div class="section-header__text">
        <h3 class="section-header__title">
            {{ 'DASHBOARD.FOOTPRINT.USER' | translate }}
        </h3>
        <p class="section-header__subtitle">
            {{ 'DASHBOARD.FOOTPRINT.USER-INFO' | translate }}
        </p>
    </div>
</div>

<div class="metrics">
    <div class="metric">
        <app-stats-card
            icon="eco"
            color="var(--color-secondary-4)"
            [label]="'DASHBOARD.POWER-GRID.GREEN-SCORE' | translate"
            [value]="greenScore.average"
        ></app-stats-card>

        <app-footprint-chart
            [title]="'DASHBOARD.POWER-GRID.GREEN-SCORE' | translate"
            [tooltip]="'DASHBOARD.GREEN-SCORE-INFO' | translate"
            color="--color-secondary-4"
            [legend]="legend"
            [timestamps]="greenScore.timestamps"
            [values]="greenScore.values"
        ></app-footprint-chart>
    </div>

    <div class="metric">
        <app-stats-card
            icon="factory"
            color="var(--color-secondary-5)"
            [label]="'DASHBOARD.POWER-GRID.CARBON' | translate"
            [value]="carbon.average"
            unit="gCO₂e/kWh"
        ></app-stats-card>

        <app-footprint-chart
            [title]="'DASHBOARD.POWER-GRID.CARBON' | translate"
            [tooltip]="'DASHBOARD.ENERGY-INFO' | translate"
            unit="gCO₂e/kWh"
            color="--color-secondary-5"
            [legend]="legend"
            [timestamps]="carbon.timestamps"
            [values]="carbon.values"
        ></app-footprint-chart>
    </div>

    <div class="metric">
        <app-stats-card
            icon="water_drop"
            color="var(--color-secondary-3)"
            [label]="'DASHBOARD.POWER-GRID.WATER' | translate"
            [value]="water.average"
            unit="l/kWh"
        ></app-stats-card>

        <app-footprint-chart
            [title]="'DASHBOARD.POWER-GRID.WATER' | translate"
            [tooltip]="'DASHBOARD.ENERGY-WATER-INFO' | translate"
            unit="l/kWh"
            color="--color-secondary-3"
            [legend]="legend"
            [timestamps]="water.timestamps"
            [values]="water.values"
        ></app-footprint-chart>
    </div>
</div>
