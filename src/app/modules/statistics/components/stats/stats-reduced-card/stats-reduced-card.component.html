<div class="env-card">
    <div class="env-card__header">
        <span class="env-card__label">{{ label }}</span>
        <div class="env-card__icons">
            <mat-icon class="env-card__icon" [style.color]="color">{{
                icon
            }}</mat-icon>

            @if (tooltip) {
                <app-ui-button
                    variant="icon"
                    icon="help_outline"
                    [tooltip]="tooltip"
                ></app-ui-button>
            }
        </div>
    </div>
    <div class="env-card__value">
        {{ value }}
        @if (unit) {
            <span class="env-card__unit">{{ unit }}</span>
        }
    </div>
</div>
