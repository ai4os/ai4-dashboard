<div class="footprint-chart">
    @if (title || tooltip) {
        <div class="footprint-chart__header">
            <span class="footprint-chart__title"
                >{{ title }}
                @if (_unit) {
                    ({{ _unit }})
                }
            </span>
            @if (tooltip) {
                <app-ui-button
                    variant="icon"
                    icon="help_outline"
                    [tooltip]="tooltip"
                ></app-ui-button>
            }
        </div>
    }
    <div class="footprint-chart__body">
        <div
            class="footprint-chart__canvas"
            echarts
            [options]="echartOptions"
        ></div>
    </div>
</div>
