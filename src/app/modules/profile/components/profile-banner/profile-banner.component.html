<app-ui-banner variant="brand">
    <div class="profile-layout">
        <div class="profile-layout__info">
            <p class="profile-layout__eyebrow">{{ eyebrow }}</p>
            <h1 class="profile-layout__title">{{ fullName }}</h1>
            <p class="profile-layout__email">{{ email }}</p>
        </div>

        <div class="profile-layout__user-id">
            <span class="profile-layout__user-id-label">{{
                'PROFILE.USER-ID' | translate
            }}</span>
            <span class="profile-layout__user-id-value">{{ userId }}</span>
        </div>
    </div>
</app-ui-banner>
