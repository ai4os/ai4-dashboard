<div class="confirmation-dialog">
    <div class="confirmation-dialog__top-accent"></div>

    <div
        mat-dialog-content
        class="confirmation-dialog__content confirmation-dialog__content--left"
    >
        <div
            class="tabs-wrapper"
            [ngClass]="{ 'tabs-mobile': mobileQuery.matches }"
        >
            <app-ui-tabs
                [tabs]="dialogTabs"
                [activeTabId]="activeTabId"
                (tabChange)="tabChanged($event)"
            ></app-ui-tabs>

            <div class="tab-content">
                <!-- Zenodo -->
                @if (activeTabId === 'zenodo') {
                    <form
                        [formGroup]="zenodoFormGroup"
                        [ngClass]="{
                            'form-flex': mobileQuery.matches,
                            'form-grid': !mobileQuery.matches,
                        }"
                    >
                        <!-- Zenodo community -->
                        <app-ui-autocomplete
                            formControlName="zenodoCommunitySelect"
                            label="CATALOG.CONF-FORMS.DATA.ZENODO.COMMUNITY"
                            placeholder="Pick one"
                            [options]="filteredCommunityOptions | async"
                            (optionSelected)="communitySelectChange()"
                        ></app-ui-autocomplete>

                        <!-- Zenodo dataset -->
                        <div class="field-with-spinner">
                            <app-ui-select
                                formControlName="zenodoDatasetSelect"
                                [label]="'CATALOG.CONF-FORMS.DATA.ZENODO.DATASET'"
                                [options]="zenodoDatasetOptions"
                                [placeholder]="
                                    zenodoFormGroup.get('zenodoCommunitySelect')
                                        ?.value === '' || datasetsLength !== 0
                                        ? ''
                                        : 'CATALOG.CONF-FORMS.DATA.ZENODO.DATASET-EMPTY'
                                "
                                (valueChange)="datasetSelectChange()"
                            ></app-ui-select>
                            @if (datasetsLoading) {
                                <div>
                                    <app-ui-loader></app-ui-loader>
                                </div>
                            }
                        </div>

                        <!-- Zenodo version -->
                        <div class="field-with-spinner">
                            <app-ui-select
                                formControlName="zenodoVersionSelect"
                                label="CATALOG.CONF-FORMS.DATA.ZENODO.VERSION"
                                [options]="zenodoDatasetVersions"
                            ></app-ui-select>
                            @if (versionsLoading) {
                                <div>
                                    <app-ui-loader></app-ui-loader>
                                </div>
                            }
                        </div>
                    </form>
                }

                <!-- DOI / URL -->
                @if (activeTabId === 'doi') {
                    <form [formGroup]="doiUrlFormGroup" class="form-flex">
                        <app-ui-text-field
                            formControlName="doiUrlInput"
                            label="CATALOG.CONF-FORMS.DATA.DOI-URL.TITLE"
                            [errorMessages]="doiUrlErrorMessages"
                        ></app-ui-text-field>
                    </form>

                    <div class="footer">
                        <p class="mt-3">
                            {{
                                'CATALOG.CONF-FORMS.DATA.DOI-URL.SUPPORT'
                                    | translate
                            }}
                            <a
                                href="https://j535d165.github.io/datahugger/repositories/"
                                target="_blank"
                            >
                                {{
                                    'CATALOG.CONF-FORMS.DATA.DOI-URL.MORE'
                                        | translate
                                }}</a
                            >!
                        </p>
                        <div class="logos-container mt-2">
                            <a href="https://zenodo.org/" target="_blank"
                                ><img
                                    class="small-logo"
                                    src="../../../../../assets/images/data-repositories/zenodo_logo.svg"
                            /></a>
                            <a href="https://figshare.com/" target="_blank"
                                ><img
                                    class="small-logo"
                                    src="../../../../../assets/images/data-repositories/figshare_logo.svg"
                            /></a>
                            <a href="https://github.com/" target="_blank"
                                ><img
                                    class="small-logo"
                                    src="../../../../../assets/images/data-repositories/github_logo.svg"
                            /></a>
                            <a href="https://datadryad.org/" target="_blank"
                                ><img
                                    class="small-logo"
                                    src="../../../../../assets/images/data-repositories/dryad_logo.png"
                            /></a>
                            <a href="https://huggingface.co/" target="_blank"
                                ><img
                                    class="small-logo"
                                    src="../../../../../assets/images/data-repositories/hf_logo.svg"
                            /></a>
                            <a href="https://osf.io/" target="_blank"
                                ><img
                                    class="small-logo"
                                    src="../../../../../assets/images/data-repositories/osf_logo.svg"
                            /></a>
                            <a href="https://data.mendeley.com/" target="_blank"
                                ><img
                                    class="small-logo"
                                    src="../../../../../assets/images/data-repositories/mendeley_logo.svg"
                            /></a>
                            <a href="https://www.seanoe.org/" target="_blank"
                                ><img
                                    class="small-logo"
                                    src="../../../../../assets/images/data-repositories/seanoe_logo.png"
                            /></a>
                            <a href="https://data.europa.eu/" target="_blank"
                                ><img
                                    class="small-logo"
                                    src="../../../../../assets/images/data-repositories/data_europa_logo.png"
                            /></a>
                        </div>
                    </div>
                }
            </div>
        </div>

        @if (dialogLoading) {
            <div class="spinner-loading-overlay">
                <app-ui-loader></app-ui-loader>
            </div>
        }
    </div>

    <!-- Acciones -->
    <div mat-dialog-actions class="confirmation-dialog__actions">
        <app-ui-button
            mat-dialog-close
            variant="default-outline"
            text="GENERAL.CLOSE"
        ></app-ui-button>
        <app-ui-button
            variant="accent-solid"
            icon="add_circle"
            text="GENERAL.ADD"
            [disabled]="!formsAreValid() || dialogLoading"
            (buttonClick)="addDataset()"
        ></app-ui-button>
    </div>
</div>
