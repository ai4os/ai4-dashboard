<div class="container">
    <app-ui-table
        [columns]="columns"
        [data]="datasets"
        trackByKey="doi"
        emptyMessage="CATALOG.CONF-FORMS.DATA.DATASETS.NO-DATASETS"
    >
        <!-- Source -->
        <ng-template uiTableCell="source" let-row>
            <img
                [ngClass]="{
                    'fit-image-doi': row.source === 'doi',
                    'fit-image-url': row.source === 'http',
                    'fit-image-zenodo': row.source === 'zenodo',
                }"
                src="../../../../../assets/images/data-repositories/{{
                    row.source
                }}_logo.svg"
                alt="{{ row.source }}"
            />
        </ng-template>

        <!-- Force Pull -->
        <ng-template uiTableCell="forcePull" let-row>
            <div class="actions-container" style="justify-content: center">
                <app-ui-checkbox
                    variant="primary"
                    [checked]="row.forcePull"
                    (valueChange)="changeForcePull($event, row)"
                ></app-ui-checkbox>
            </div>
        </ng-template>

        <!-- Actions -->
        <ng-template uiTableCell="actions" let-row>
            <app-ui-button
                variant="danger-solid"
                icon="delete"
                tooltip="{{ 'GENERAL.DELETE' | translate }}"
                (click)="removeDataset($event, row)"
            ></app-ui-button>
        </ng-template>
    </app-ui-table>

    <app-ui-button
        text="{{ 'CATALOG.CONF-FORMS.DATA.DATASETS.ADD' | translate }}"
        (click)="openAddDatasetDialog()"
    ></app-ui-button>
</div>
