<app-stepper-form
    [title]="title"
    [numberOfSteps]="2"
    [step1]="step1"
    [step2]="step2"
    [step1Form]="generalConfForm"
    [step2Form]="storageConfForm"
    [step1Title]="step1Title"
    [step2Title]="step2Title"
    [isLoading]="showLoader"
    (showHelpButtonEvent)="showHelpButtonChange($event)"
    (submitted)="onSubmit()"
>
    <ng-template #step1>
        <form [formGroup]="generalConfForm" class="form">
            <app-general-conf-form
                class="child-form-container"
                [defaultFormValues]="generalConfDefaultValues"
                [showHelp]="showHelp"
                [showFields]="showGeneralFields"
            ></app-general-conf-form>
            <mat-divider></mat-divider>
            <app-cvat-conf-form
                [defaultFormValues]="cvatConfDefaultValues"
                [showHelp]="showHelp"
            ></app-cvat-conf-form>
        </form>
    </ng-template>
    <ng-template #step2>
        <form [formGroup]="storageConfForm" class="form">
            <app-storage-conf-form
                class="child-form-container"
                [defaultFormValues]="storageConfDefaultValues"
                [showHelp]="showHelp"
                [isCvatTool]="true"
            ></app-storage-conf-form>
        </form>
    </ng-template>
</app-stepper-form>
